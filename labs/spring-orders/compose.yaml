name: study-go-spring-orders

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: study-root-local
      MYSQL_DATABASE: orders
      MYSQL_USER: study
      MYSQL_PASSWORD: study-local
    volumes:
      - mysql-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-orders.sql:ro
    healthcheck:
      # TCP 探针同时检查初始化表。只在应用账号能通过网络读表后启动 Java。
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT id FROM products LIMIT 1' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 40

  api:
    image: study-go-spring-orders-api
    build:
      context: ../..
      dockerfile: labs/spring-orders/Dockerfile
    environment:
      # 示例凭据和禁用 TLS 的连接只用于本机容器实验，数据库端口不映射到宿主机。
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/orders?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectTimeout=1500&socketTimeout=5000"
      SPRING_DATASOURCE_USERNAME: study
      SPRING_DATASOURCE_PASSWORD: study-local
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SPRING_ORDERS_PORT:-18085}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "-o", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 40

volumes:
  mysql-data:
