name: Deploy learning workbench

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java/pom.xml
      # 入门模块与进阶栈分别检查；接口测试各自创建内存数据。
      - run: go test -race ./...
        working-directory: go
      - run: mvn --batch-mode --no-transfer-progress -f java/pom.xml test

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: labs/stack/go.mod
          cache-dependency-path: labs/stack/go.sum
      - run: go test ./...
        working-directory: labs/stack
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-pages

  deploy:
    needs: [build, contracts]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
